# ------------------------------------------------------------------
# Site settings — edit these first
# ------------------------------------------------------------------
title: Godsec
tagline: Offensive Security · Research · Writeups
description: >-
  Cybersecurity blog and portfolio of Godsec — web application pentesting,
  Active Directory security, red teaming, bug bounty, OSINT, malware analysis,
  and hands-on CTF / Hack The Box writeups.
url: "https://godsec.is-a.dev"
baseurl: ""                        # keep empty for a root user site
lang: en
timezone: UTC

author:
  name: Godsec
  bio: >-
    Offensive Security Consultant — penetration testing, red teaming,
    and adversary simulation, with a SOC and threat-detection background.

# Social handles (footer + share links). Leave blank ("") to hide.
social_links:
  github: POXOZ           # GitHub username
  linkedin: nithish-guru
  hackthebox: ""
  tryhackme: "https://tryhackme.com/p/NithisX"
  rss: false

# Used by jekyll-seo-tag
twitter:
  username: ""
  card: summary_large_image
social:
  name: Godsec
  links:
    - https://github.com/POXOZ
    - https://www.linkedin.com/in/nithish-guru

# ------------------------------------------------------------------
# Build settings — rarely needs editing
# ------------------------------------------------------------------
permalink: /blog/:title/
paginate: 8
paginate_path: "/blog/page:num/"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore
